name: maintenance-observations

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [standalone-package]
    types: [completed]

permissions:
  contents: read

# All issue writers share this group, including default-branch failure events.
concurrency:
  group: cruxomni-maintenance-issue-writer
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      vars.CRUXOMNI_MAINTENANCE_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Observe dependencies without public security diagnostics
        if: github.event_name != 'workflow_run'
        run: |
          if ! bun audit --json > "$RUNNER_TEMP/dependency-audit.json" 2> "$RUNNER_TEMP/dependency-audit-errors.txt"; then
            echo 'Dependency review requires maintainer attention; inspect privately.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Reconcile public maintenance observations
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CRUXOMNI_MAINTENANCE_ENABLED: "true"
        run: bun run scripts/maintenance.ts --apply
      - name: Report trusted default-branch failure
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CRUXOMNI_MAINTENANCE_ENABLED: "true"
          MAINTENANCE_FAILURE_RUN: ${{ github.event.workflow_run.id }}
        run: bun run scripts/maintenance.ts failure
