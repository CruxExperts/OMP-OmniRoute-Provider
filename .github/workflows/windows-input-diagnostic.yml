name: windows-input-diagnostic

on:
  workflow_dispatch:
    inputs:
      research:
        description: Run source-built Windows x64 causal research instead of official diagnostics
        type: boolean
        default: false
      acl_only:
        description: Run only the native private ACL diagnostic on both Windows architectures
        type: boolean
        default: false
      acp_only:
        description: Run only the native owned ACP fixture on both Windows architectures
        type: boolean
        default: false
      acp_arm_only:
        description: Limit native ACP diagnostic to Windows ARM64
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  npm_config_ignore_scripts: "true"
  GH_PROMPT_DISABLED: "1"

jobs:
  package:
    if: ${{ !inputs.research && !inputs.acl_only && !inputs.acp_only }}
    name: prepare-diagnostic-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Prepare package using the qualification exporter
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run check:upstreams
          bun run prepare:upstream
          bun run export:release
          (cd release && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-diagnostic-release-input
          path: release/
          if-no-files-found: error
          retention-days: 14

  host:
    if: ${{ !inputs.research && !inputs.acl_only && !inputs.acp_only }}
    name: native-login-${{ matrix.id }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Install exact locked dependencies
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify native private configuration and reject broad grants
        shell: pwsh
        run: bun test test/config.test.ts --test-name-pattern 'profile writes|Windows rejects broad|cancelled config updates' --timeout=60000
      - name: Verify owned native process timeout lifecycle
        shell: bash
        run: bun test test/release-automation.test.ts --test-name-pattern 'handles an owned native process tree|does not target an exited wrapper|retains the workspace when process tree termination is unconfirmed|rejects cancellation during either evidence write' --timeout=30000
      - name: Download this run's diagnostic package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-diagnostic-release-input --dir "$RUNNER_TEMP/release"
      - name: Observe pinned native host login
        shell: bash
        env:
          QUALIFICATION_TARGET: ${{ matrix.id }}
          OMP_SMOKE_LOGIN_DIAGNOSTIC_PATH: ${{ runner.temp }}/native-login-diagnostic.json
        run: bun run scripts/qualify-release.ts target --id "$QUALIFICATION_TARGET" --release-dir "$RUNNER_TEMP/release" --output-dir "$RUNNER_TEMP/diagnostic-output"
      - name: Upload sanitized observation only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-login-diagnostic-${{ matrix.id }}
          path: ${{ runner.temp }}/native-login-diagnostic.json
          if-no-files-found: error
          retention-days: 14

  probe:
    if: ${{ (!inputs.research || inputs.acl_only) && !inputs.acp_only }}
    name: input-transport-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Probe native input transport
        if: ${{ !inputs.acl_only }}
        shell: pwsh
        run: bun run scripts/windows-input-probe.ts "$env:RUNNER_TEMP/windows-input-diagnostic.json"
      - name: Probe native private ACL operations
        if: always()
        shell: pwsh
        run: bun run scripts/windows-input-probe.ts --acl "$env:RUNNER_TEMP/windows-acl-diagnostic.json"
      - name: Prepare isolated Bun test probe
        if: ${{ always() && inputs.acl_only }}
        shell: bash
        run: |
          bun -e 'import {writeFileSync} from "node:fs";import {join} from "node:path";import {pathToFileURL} from "node:url";const probe=pathToFileURL(join(process.env.GITHUB_WORKSPACE,"scripts/windows-input-probe.ts")).href;writeFileSync(join(process.env.RUNNER_TEMP,"windows-acl-runtime.test.ts"),`import {test,expect} from "bun:test";import {aclProbe} from ${JSON.stringify(probe)};test("native ACL runtime comparison",async()=>{expect(await aclProbe(process.env.ACL_COMPARE_OUTPUT!)).toBe(true);},120000);`);'
      - name: Compare native ACL operations in Bash Bun run
        if: ${{ always() && inputs.acl_only }}
        shell: bash
        run: bun run scripts/windows-input-probe.ts --acl "$RUNNER_TEMP/windows-acl-bash-run.json"
      - name: Compare native ACL operations in Bash Bun test
        if: ${{ always() && inputs.acl_only }}
        shell: bash
        env:
          ACL_COMPARE_OUTPUT: ${{ runner.temp }}/windows-acl-bash-test.json
        run: bun test "$RUNNER_TEMP/windows-acl-runtime.test.ts" --timeout=120000
      - name: Compare native ACL operations in PowerShell Bun test
        if: ${{ always() && inputs.acl_only }}
        shell: pwsh
        env:
          ACL_COMPARE_OUTPUT: ${{ runner.temp }}/windows-acl-pwsh-test.json
        run: bun test "$env:RUNNER_TEMP/windows-acl-runtime.test.ts" --timeout=120000
      - name: Upload bounded diagnostic only
        if: ${{ always() && !inputs.acl_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-input-diagnostic-${{ matrix.id }}
          path: ${{ runner.temp }}/windows-input-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded ACL observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-acl-diagnostic-${{ matrix.id }}
          path: ${{ runner.temp }}/windows-acl-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated runtime comparisons
        if: ${{ always() && inputs.acl_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-acl-runtime-comparison-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/windows-acl-bash-run.json
            ${{ runner.temp }}/windows-acl-bash-test.json
            ${{ runner.temp }}/windows-acl-pwsh-test.json
          if-no-files-found: error
          retention-days: 14
  acp:
    if: ${{ inputs.acp_only && !inputs.research && !inputs.acl_only }}
    name: native-owned-acp-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.acp_arm_only && '[{"id":"windows-arm64","runner":"windows-11-arm"}]' || '[{"id":"windows-x64","runner":"windows-2025"},{"id":"windows-arm64","runner":"windows-11-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Install locked dependencies and prepare pinned source
        shell: bash
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run prepare:upstream
      - name: Bind exact source and test inputs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-upstream.py --verify-qualification-source > "$RUNNER_TEMP/acp-verified-source.private.json"
          bun -e '
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import ts from "typescript";
          import { execFileSync } from "node:child_process";
          import { lstatSync } from "node:fs";
          import { testCaseSourceHash } from "./scripts/generate-contracts.ts";
          const hash = file => createHash("sha256").update(readFileSync(file)).digest("hex");
          const tracked = execFileSync("git", ["--no-replace-objects", "ls-tree", "-r", "-z", "HEAD"], { maxBuffer: 8 * 1024 * 1024 }).toString("utf8").split("\0").filter(Boolean);
          if (tracked.length > 20000) throw new Error("Tracked source count exceeds verification bound");
          let total = 0;
          for (const entry of tracked) {
            const match = /^(100644|100755|120000) blob ([a-f0-9]{40})\t(.+)$/.exec(entry);
            if (!match) throw new Error("Invalid tracked source entry");
            const [, mode, expectedBlob, file] = match;
            if (file.startsWith("assets/")) continue;
            if (!(/\.(?:ts|tsx|mts|cts|js|jsx|mjs|cjs|json|py|yml|yaml)$/.test(file) || file === "bun.lock" || file === ".gitattributes" || file === ".github/crux-experts-release-signing-key.asc" || file.startsWith("provenance/derivations/"))) continue;
            if (mode === "120000" || file.length > 200 || !/^[A-Za-z0-9._/-]+$/.test(file) || file.startsWith("-") || file.split("/").some(part => !part || part === "." || part === "..")) throw new Error("Invalid tracked source path");
            const info = lstatSync(file);
            if (!info.isFile() || info.isSymbolicLink() || info.size > 64 * 1024 * 1024 || (total += info.size) > 512 * 1024 * 1024) throw new Error("Invalid tracked source file");
            const bytes = readFileSync(file);
            const actualBlob = createHash("sha1").update(`blob ${bytes.length}\0`).update(bytes).digest("hex");
            if (actualBlob !== expectedBlob) throw new Error(`Tracked source checkout differs from Git blob: ${file}`);
          }
          const verified = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/acp-verified-source.private.json", "utf8"));
          const sha = value => typeof value === "string" && /^[a-f0-9]{64}$/.test(value);
          if (!sha(verified.derivation?.sha256) || !sha(verified.treeSha256) || typeof verified.derivation?.record !== "string") throw new Error("Invalid verified source identity");
          const inputs = { schemaVersion: 2, caseSha256: testCaseSourceHash("test/admin-acp-agents.test.ts"),
            lockfileSha256: hash("bun.lock"), packageSha256: hash("package.json"),
            compilerPackageSha256: hash("node_modules/typescript/package.json"), compilerSha256: hash("node_modules/typescript/lib/typescript.js"), compilerVersion: ts.version,
            workflowSha256: hash(".github/workflows/windows-input-diagnostic.yml"),
            upstreamManifestSha256: hash("provenance/upstreams.json"),
            sourceDerivation: verified.derivation, effectiveTreeSha256: verified.treeSha256 };
          if (!sha(inputs.caseSha256) || !/^[0-9]+\.[0-9]+\.[0-9]+(?:[-.][A-Za-z0-9.-]+)?$/.test(inputs.compilerVersion)) throw new Error("Invalid test or compiler identity");
          writeFileSync(process.env.RUNNER_TEMP + "/acp-bound-inputs.json", JSON.stringify(inputs));
          '
      - name: Run focused native owned ACP fixture
        shell: pwsh
        env:
          ACP_TARGET: ${{ matrix.id }}
          ACP_OBSERVATION_PATH: ${{ runner.temp }}/windows-acp-stage.json
          ACP_FIXTURE_PARENT: ${{ runner.temp }}
        run: |
          '{"stage":"not-started","category":"incomplete"}' | Set-Content -Encoding utf8 $env:ACP_OBSERVATION_PATH
          $inputs = Get-Content -Raw "$env:RUNNER_TEMP/acp-bound-inputs.json" | ConvertFrom-Json
          $result = [ordered]@{
            schemaVersion = $inputs.schemaVersion
            caseSha256 = $inputs.caseSha256
            lockfileSha256 = $inputs.lockfileSha256
            packageSha256 = $inputs.packageSha256
            compilerPackageSha256 = $inputs.compilerPackageSha256
            compilerSha256 = $inputs.compilerSha256
            compilerVersion = $inputs.compilerVersion
            workflowSha256 = $inputs.workflowSha256
            upstreamManifestSha256 = $inputs.upstreamManifestSha256
            sourceDerivation = $inputs.sourceDerivation
            effectiveTreeSha256 = $inputs.effectiveTreeSha256
            target = $env:ACP_TARGET
            commit = $env:GITHUB_SHA
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToUpperInvariant()
            bun = (bun --version).Trim()
            bunArchitecture = (bun -e 'process.stdout.write(process.arch)').Trim()
            sourceManifestSha256 = (Get-FileHash provenance/route-sources.json -Algorithm SHA256).Hash.ToLowerInvariant()
            fixtureSha256 = (Get-FileHash test/fixtures/acp-agents.fixture.ts -Algorithm SHA256).Hash.ToLowerInvariant()
            testSha256 = (Get-FileHash test/admin-acp-agents.test.ts -Algorithm SHA256).Hash.ToLowerInvariant()
            outcome = 'failed'
          }
          $expectedArch = if ($env:ACP_TARGET -eq 'windows-arm64') { 'ARM64' } else { 'X64' }
          if ($result.architecture -ne $expectedArch -or $result.bunArchitecture -ne $expectedArch.ToLowerInvariant()) {
            $result | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/windows-acp-result.json"
            throw 'Native runner architecture mismatch.'
          }
          bun test test/admin-acp-agents.test.ts --test-name-pattern 'Windows native owned ACP probes' --timeout=30000 *> $null
          $code = $LASTEXITCODE
          if ($code -eq 0) { $result.outcome = 'passed' }
          $result | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/windows-acp-result.json"
          if ($code -ne 0) { throw 'Native owned ACP fixture failed; raw output withheld.' }
      - name: Upload bounded ACP observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-owned-acp-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/windows-acp-result.json
            ${{ runner.temp }}/windows-acp-stage.json
          if-no-files-found: error
          retention-days: 14


  research:
    if: ${{ inputs.research && !inputs.acl_only && !inputs.acp_only }}
    uses: ./.github/workflows/windows-login-research.yml
    permissions:
      contents: read
      actions: read
