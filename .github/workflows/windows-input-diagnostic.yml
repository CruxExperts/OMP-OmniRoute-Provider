name: windows-input-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: input-transport-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Probe native input transport
        shell: pwsh
        run: bun run scripts/windows-input-probe.ts "$env:RUNNER_TEMP/windows-input-diagnostic.json"
      - name: Upload bounded diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-input-diagnostic-${{ matrix.id }}
          path: ${{ runner.temp }}/windows-input-diagnostic.json
          if-no-files-found: error
          retention-days: 14
