name: windows-input-diagnostic

on:
  workflow_dispatch:
    inputs:
      research:
        description: Run source-built Windows x64 causal research instead of official diagnostics
        type: boolean
        default: false
      acl_only:
        description: Run only the native private ACL diagnostic on both Windows architectures
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  npm_config_ignore_scripts: "true"
  GH_PROMPT_DISABLED: "1"

jobs:
  package:
    if: ${{ !inputs.research && !inputs.acl_only }}
    name: prepare-diagnostic-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Prepare package using the qualification exporter
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bun run check:upstreams
          bun run prepare:upstream
          bun run export:release
          (cd release && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-diagnostic-release-input
          path: release/
          if-no-files-found: error
          retention-days: 14

  host:
    if: ${{ !inputs.research && !inputs.acl_only }}
    name: native-login-${{ matrix.id }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Install exact locked dependencies
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify native private configuration and reject broad grants
        shell: pwsh
        run: bun test test/config.test.ts --test-name-pattern 'profile writes|Windows rejects broad|cancelled config updates' --timeout=60000
      - name: Download this run's diagnostic package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-diagnostic-release-input --dir "$RUNNER_TEMP/release"
      - name: Observe pinned native host login
        shell: bash
        env:
          QUALIFICATION_TARGET: ${{ matrix.id }}
          OMP_SMOKE_LOGIN_DIAGNOSTIC_PATH: ${{ runner.temp }}/native-login-diagnostic.json
        run: bun run scripts/qualify-release.ts target --id "$QUALIFICATION_TARGET" --release-dir "$RUNNER_TEMP/release" --output-dir "$RUNNER_TEMP/diagnostic-output"
      - name: Upload sanitized observation only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-login-diagnostic-${{ matrix.id }}
          path: ${{ runner.temp }}/native-login-diagnostic.json
          if-no-files-found: error
          retention-days: 14

  probe:
    if: ${{ !inputs.research || inputs.acl_only }}
    name: input-transport-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Probe native input transport
        if: ${{ !inputs.acl_only }}
        shell: pwsh
        run: bun run scripts/windows-input-probe.ts "$env:RUNNER_TEMP/windows-input-diagnostic.json"
      - name: Probe native private ACL operations
        if: always()
        shell: pwsh
        run: bun run scripts/windows-input-probe.ts --acl "$env:RUNNER_TEMP/windows-acl-diagnostic.json"
      - name: Prepare isolated Bun test probe
        if: ${{ always() && inputs.acl_only }}
        shell: bash
        run: |
          bun -e 'import {writeFileSync} from "node:fs";import {join} from "node:path";import {pathToFileURL} from "node:url";const probe=pathToFileURL(join(process.env.GITHUB_WORKSPACE,"scripts/windows-input-probe.ts")).href;writeFileSync(join(process.env.RUNNER_TEMP,"windows-acl-runtime.test.ts"),`import {test,expect} from "bun:test";import {aclProbe} from ${JSON.stringify(probe)};test("native ACL runtime comparison",async()=>{expect(await aclProbe(process.env.ACL_COMPARE_OUTPUT!)).toBe(true);},120000);`);'
      - name: Compare native ACL operations in Bash Bun run
        if: ${{ always() && inputs.acl_only }}
        shell: bash
        run: bun run scripts/windows-input-probe.ts --acl "$RUNNER_TEMP/windows-acl-bash-run.json"
      - name: Compare native ACL operations in Bash Bun test
        if: ${{ always() && inputs.acl_only }}
        shell: bash
        env:
          ACL_COMPARE_OUTPUT: ${{ runner.temp }}/windows-acl-bash-test.json
        run: bun test "$RUNNER_TEMP/windows-acl-runtime.test.ts" --timeout=120000
      - name: Compare native ACL operations in PowerShell Bun test
        if: ${{ always() && inputs.acl_only }}
        shell: pwsh
        env:
          ACL_COMPARE_OUTPUT: ${{ runner.temp }}/windows-acl-pwsh-test.json
        run: bun test "$env:RUNNER_TEMP/windows-acl-runtime.test.ts" --timeout=120000
      - name: Upload bounded diagnostic only
        if: ${{ always() && !inputs.acl_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-input-diagnostic-${{ matrix.id }}
          path: ${{ runner.temp }}/windows-input-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded ACL observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-acl-diagnostic-${{ matrix.id }}
          path: ${{ runner.temp }}/windows-acl-diagnostic.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated runtime comparisons
        if: ${{ always() && inputs.acl_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-acl-runtime-comparison-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/windows-acl-bash-run.json
            ${{ runner.temp }}/windows-acl-bash-test.json
            ${{ runner.temp }}/windows-acl-pwsh-test.json
          if-no-files-found: error
          retention-days: 14

  research:
    if: ${{ inputs.research && !inputs.acl_only }}
    uses: ./.github/workflows/windows-login-research.yml
    permissions:
      contents: read
      actions: read
