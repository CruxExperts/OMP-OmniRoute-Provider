name: release-qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification scope (preflight may stage the approved bubblewrap package)
        type: choice
        options: [full, ingress-only, preflight-only]
        default: full
      approved_node_archive_sha256:
        description: Explicitly approved Node 24.17.0 Linux x64 archive SHA256 (required except preflight-only)
        type: string
        required: false
      approved_bwrap_sha256:
        description: Explicitly approved bubblewrap Debian package SHA256 (required to stage the helper)
        type: string
        required: false
      approve_ci_apparmor:
        description: Approve a temporary exact-helper AppArmor profile on the disposable hosted Linux runner
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: cruxomni-release-qualification-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: "true"
  npm_config_ignore_scripts: "true"
  GH_PROMPT_DISABLED: "1"

jobs:
  package:
    name: prepare-reviewed-package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - name: Stage the approved helper and check ingress sandbox prerequisites
        env:
          APPROVED_BWRAP_SHA256: ${{ inputs.approved_bwrap_sha256 }}
          APPROVE_CI_APPARMOR: ${{ inputs.approve_ci_apparmor }}
        run: |
          set -euo pipefail
          if [ -n "$APPROVED_BWRAP_SHA256" ]; then
            python3 scripts/pinned-ingress.py --bwrap-stage-only --bwrap-stage-dir "$RUNNER_TEMP/pinned-bwrap" --approve-bwrap-sha256 "$APPROVED_BWRAP_SHA256"
            if [ "$APPROVE_CI_APPARMOR" = true ]; then
              python3 scripts/pinned-ingress.py --ci-apparmor-load --approve-ci-apparmor
            fi
            python3 scripts/pinned-ingress.py --preflight-only --bwrap "$RUNNER_TEMP/pinned-bwrap/bwrap"
          else
            test "$APPROVE_CI_APPARMOR" != true
            python3 scripts/pinned-ingress.py --preflight-only
          fi
      - name: Stage and run the pinned ingress research prerequisite
        if: ${{ inputs.mode != 'preflight-only' }}
        env:
          APPROVED_NODE_ARCHIVE_SHA256: ${{ inputs.approved_node_archive_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/pinned-ingress.py --bwrap "$RUNNER_TEMP/pinned-bwrap/bwrap" --stage-dir "$RUNNER_TEMP/pinned-ingress" --approve-node-archive-sha256 "$APPROVED_NODE_ARCHIVE_SHA256" > "$RUNNER_TEMP/pinned-ingress-paths.json"
          python3 scripts/pinned-ingress.py --bwrap "$RUNNER_TEMP/pinned-bwrap/bwrap" --node "$RUNNER_TEMP/pinned-ingress/node" --source-archive "$RUNNER_TEMP/pinned-ingress/source.tar.gz" --dependency-dir "$RUNNER_TEMP/pinned-ingress/dependencies" --output-dir "$RUNNER_TEMP/pinned-ingress"
      - name: Retain the sanitized ingress observation
        if: ${{ inputs.mode != 'preflight-only' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          observations=("$RUNNER_TEMP"/pinned-ingress/ingress-run-*/export/observed-outcomes.json)
          test "${#observations[@]}" -eq 1
          test -f "${observations[0]}" && test ! -L "${observations[0]}"
      - name: Upload source-bound sanitized ingress outcomes
        if: ${{ inputs.mode != 'preflight-only' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cruxomni-ingress-observed-outcomes
          path: ${{ runner.temp }}/pinned-ingress/ingress-run-*/export/observed-outcomes.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload sanitized ingress failure classification when present
        if: ${{ always() && inputs.mode != 'preflight-only' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cruxomni-ingress-failure
          path: ${{ runner.temp }}/pinned-ingress/failure.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ inputs.mode == 'full' }}
        with: { bun-version: "1.4.2" }
      - name: Install exact locked dependencies
        if: ${{ inputs.mode == 'full' }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source and build the single reviewed archive
        if: ${{ inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          bun run check:upstreams
          bun run prepare:upstream
          bun run typecheck
          test_workers="$(( $(nproc) / 3 ))"
          if [ "$test_workers" -lt 1 ]; then test_workers=1; fi
          bun test --max-concurrency="$test_workers" --parallel="$test_workers" --timeout=15000
          python3 test/capture-walkthrough.test.py
          bun run verify:qualification
          bun run scripts/acquire-route-corpus.ts --check
          bun run verify:contracts
          bun run docs:check
          bun run verify:marketplace
          bun run verify:package
          bun run export:release
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Upload the immutable package and manifest once
        if: ${{ inputs.mode == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cruxomni-release-input
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary hosted CI AppArmor profile
        if: ${{ always() && inputs.approve_ci_apparmor }}
        run: python3 scripts/pinned-ingress.py --ci-apparmor-cleanup --approve-ci-apparmor

  native:
    name: ${{ matrix.id }}
    needs: package
    if: ${{ inputs.mode == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64-glibc
            runner: ubuntu-24.04
          - id: linux-arm64-glibc
            runner: ubuntu-24.04-arm
          - id: darwin-x64
            runner: macos-15-intel
          - id: darwin-arm64
            runner: macos-15
          - id: windows-x64
            runner: windows-2025
          - id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify owned native process timeout lifecycle
        if: ${{ runner.os == 'Windows' }}
        run: bun test test/release-automation.test.ts --test-name-pattern 'handles an owned native process tree|does not target an exited wrapper|retains the workspace when process tree termination is unconfirmed|rejects cancellation during either evidence write' --timeout=30000
      - name: Download the exact package built by this run
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_TARGET: ${{ matrix.id }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cruxomni-release-input --dir "$RUNNER_TEMP/release"
      - name: Run native package and host lifecycle smoke
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_TARGET: ${{ matrix.id }}
        run: |
          set -euo pipefail
          bun run scripts/qualify-release.ts target --id "$QUALIFICATION_TARGET" --release-dir "$RUNNER_TEMP/release" --output-dir "$RUNNER_TEMP/target-output"
      - name: Upload this native target's observed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-evidence-${{ matrix.id }}
          path: ${{ runner.temp }}/target-output/
          if-no-files-found: error
          retention-days: 14

  linux-x64-musl:
    name: linux-x64-musl
    needs: package
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Download the exact package built by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cruxomni-release-input --dir "$RUNNER_TEMP/release"
      - name: Rebuild the reviewed native x64 musl runtime and qualify the exact archive
        env:
          QUALIFICATION_TARGET: linux-x64-musl
        run: |
          set -euo pipefail
          bun run scripts/qualify-release.ts musl-target --id "$QUALIFICATION_TARGET" --release-dir "$RUNNER_TEMP/release" --output-dir "$RUNNER_TEMP/target-output"
      - name: Upload this native target's observed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-evidence-linux-x64-musl
          path: ${{ runner.temp }}/target-output/
          if-no-files-found: error
          retention-days: 14

  linux-arm64-musl:
    name: linux-arm64-musl
    needs: package
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Download the exact package built by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cruxomni-release-input --dir "$RUNNER_TEMP/release"
      - name: Rebuild the reviewed native arm64 musl runtime and qualify the exact archive
        env:
          QUALIFICATION_TARGET: linux-arm64-musl
        run: |
          set -euo pipefail
          bun run scripts/qualify-release.ts musl-target --id "$QUALIFICATION_TARGET" --release-dir "$RUNNER_TEMP/release" --output-dir "$RUNNER_TEMP/target-output"
      - name: Upload this native target's observed evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-evidence-linux-arm64-musl
          path: ${{ runner.temp }}/target-output/
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: aggregate-qualified-targets
    needs: [package, native, linux-x64-musl, linux-arm64-musl]
    if: ${{ success() && inputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Download the exact package and all eight native target outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name cruxomni-release-input --dir "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/targets"
          for target in linux-x64-glibc linux-arm64-glibc linux-x64-musl linux-arm64-musl darwin-x64 darwin-arm64 windows-x64 windows-arm64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "qualification-evidence-$target" --dir "$RUNNER_TEMP/targets/$target"
          done
      - name: Validate actual native smoke outputs and assemble the receipt
        run: bun run scripts/qualify-release.ts aggregate --release-dir "$RUNNER_TEMP/release" --target-artifacts-dir "$RUNNER_TEMP/targets" --output-dir "$RUNNER_TEMP/qualification-bundle"
      - name: Upload qualification receipt and referenced evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cruxomni-release-qualification
          path: ${{ runner.temp }}/qualification-bundle/
          if-no-files-found: error
          retention-days: 90
