name: windows-login-research

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"
  npm_config_ignore_scripts: "true"
  GH_PROMPT_DISABLED: "1"

jobs:
  native-research:
    name: native-windows-x64-research-only
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Preserve repository bytes on checkout
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false, fetch-depth: 1 }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: "1.4.2" }
      - name: Install locked provider dependencies
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare checkout-matched provider package
        shell: bash
        env:
          CRUXOMNI_RELEASE_DIR: ${{ runner.temp }}/windows-research-release
        run: |
          set -euo pipefail
          bun run check:upstreams
          bun run prepare:upstream
          bun run export:release
          (cd "$CRUXOMNI_RELEASE_DIR" && sha256sum -c SHA256SUMS.txt)
      - name: Build and observe research hosts
        shell: pwsh
        run: python scripts/build-windows-research.py
      - name: Upload bounded research observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-login-research-observations
          path: ${{ runner.temp }}/windows-login-research-observations/*.json
          if-no-files-found: error
          retention-days: 7
