name: Feature request
description: Describe the workflow and desired outcome.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the user impact and any current workaround. Search existing issues first.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Include relevant versions and constraints, without credentials or private infrastructure details.
    validations:
      required: true
